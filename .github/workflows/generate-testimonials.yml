name: Generate verified testimonials

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: generate-verified-testimonials
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync with main
        run: git pull --rebase origin main

      - name: Generate verified testimonial HTML
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-testimonials.js

      - name: Publish generated HTML
        run: |
          if git diff --quiet -- testimony/testimonios.html testimony/testimonials.html; then
            echo "No testimonial changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testimony/testimonios.html testimony/testimonials.html
          git commit -m "chore: update verified testimonials"
          git push
